{% extends "layout.html" %}

{% block title %}
    change_password
{% endblock %}

{% block head %}
    <style>
        #main_div {
            width: 50%;
            margin: auto;
            margin-top: 30px;
        }


        #div0, #div1, #div2 {
            display:flex;
            align-items:center;
            margin-bottom:10px;
            width: 100%
        }

        button {
            margin-top: 10px;
            width:100%;
        }

        label {
            width:150px;
            text-align:left;
            font-weight:bold
        }

        input {
            flex:1;
            padding: 5px;
        }
       </style>

{% endblock %}


{%  block main %}
    <h1 style="font-size:1.75rem" >Change password</h1>

    <div id="main_div">
        <form action="/change_password" method="POST">
            <div id="div0">
                <label for="prev_password0">previous password </label>
                <input id="prev_password0" name="prev_password0" type="text" autocomplete="off">
            </div>

            <div id="div1">
                <label for="new_password0">new password </label>
                <input id="new_password0" name="new_password0" type="text" autocomplete="off">
            </div>

            <div id="div2">
                <label for="confirm_new_password0">confirm new password </label>
                <input id="confirm_new_password0" name="confirm_new_password0" type="text" autocomplete="off">
            </div>

            <button type="submit"> change </button>
         </form>
    </div>

{% endblock %}

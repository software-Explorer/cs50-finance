    </form>



<!-- Script to show district option if Nepal is selected-->
 <script>
    // 1. Get our elements
    let countrySelect = document.getElementById('country');
    let districtDiv = document.getElementById('districtDiv');

    // 2. Add a 'change' event listener
    countrySelect.addEventListener('change', function() {

        // 3. Check the VALUE, not the name
        if (this.value === "NP") {
            // 4. Use backticks `` for multi-line HTML strings
            districtDiv.innerHTML = `
                <p style="display:inline-block">Select district:</p>
                <select name="district">
                    {% for province, districts in province_map.items() %}
                        <optgroup label="{{ province }}">
                            {% for district in districts %}
                                <option value="{{ district }}">{{ district }}</option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            `;
        } else {
            // Clear the div if any other country is selected
            districtDiv.innerHTML = '';
        }
    });
</script>

{% extends "layout.html" %}

{% block title %}
<title>cash deposit</title>

{% endblock %}
    {% block head %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&display=swap" rel="stylesheet">
    <link href="../static/my_styles.css" rel="stylesheet">

        <style>
            /* 1. The wrapper must be relative so the symbol can position itself inside it */
    .input-icon-container {
        position: relative;
        display: flex;
        flex: 1; /* Makes it stretch smoothly to fill the flex form row */
    }

    /* 2. Position the dollar sign cleanly over the text area */
    .currency-symbol {
        position: absolute;
        left: 25.5%;
        top: 50%;
        transform: translateY(-50%); /* Centers it vertically perfectly */
        color: #9a9a9a;                 /* Blends the color to look natural */
        font-weight: bold;
        pointer-events: none;        /* Allows clicks to pass through directly to the input box */
        z-index: 5;
    }

    /* 3. Give the input extra padding on the left so numbers start after the '$' */
    .input-icon-container input {
        width: 50%;
        margin: auto;
        padding: 6px 6px 6px 22px !important; /* 22px left padding makes space for the symbol */
        box-sizing: border-box;
    }
</style>
{% endblock %}

{% block main %}
    <h1 class="honk" id="title"> Deposit cash</h1>
    <form action="/cash_deposit" method="POST">
        <div class="input-icon-container">
            <span class="currency-symbol">$</span>
            <input id="amount" name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <button id="quote_button" type="submit" style="margin-top:5px">Deposit</button>
    </form>
{% endblock %}
